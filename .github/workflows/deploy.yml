name: Deploy Portfolio to GitHub Pages

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches:
      - main # Automatically deploy on push to main branch

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WasmJs Production Distribution
        run: ./gradlew :webApp:wasmJsBrowserProductionExecutableDistribution --no-daemon

      - name: Optimize Assets with Gzip Compression
        run: |
          # Go to the production distribution folder
          CD_DIR="webApp/build/dist/wasmJs/productionExecutable"
          cd "$CD_DIR"
          
          echo "Compressing webApp.wasm..."
          # Pre-compress .wasm, .js, .html, and .css files with max compression level
          gzip -9 -k webApp.wasm || true
          gzip -9 -k webApp.js || true
          gzip -9 -k index.html || true
          
          echo "Current directory contents:"
          ls -lh
          cd -

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: webApp/build/dist/wasmJs/productionExecutable # The folder the action should deploy.
          branch: gh-pages # The branch the action should deploy to.
          clean: true
